name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        extras: ["dev"]
        include:
          - python-version: "3.12"
            extras: "dev,ccl"

    name: Python ${{ matrix.python-version }} (${{ matrix.extras }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${{ matrix.extras }}]"
          python -m pip check

      - name: Verify optional cosmology backend
        env:
          EXTRAS: ${{ matrix.extras }}
        run: |
          python - <<'PY'
          import os
          from importlib.util import find_spec

          import lfkit

          has_ccl = find_spec("pyccl") is not None
          expects_ccl = "ccl" in os.environ["EXTRAS"].split(",")

          assert has_ccl == expects_ccl

          if expects_ccl:
              import pyccl

          print(f"PyCCL installed: {has_ccl}")
          PY

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: |
          pytest \
            --cov=lfkit \
            --cov-report=term-missing
